[package]
name = "castellum-provider-smtp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
castellum-mail = { path = "../castellum-mail" }
castellum-models = { path = "../castellum-models" }
castellum-providers = { path = "../castellum-providers" }
# Blocking SMTP only (no tokio): smtp-transport for the client, native-tls for
# STARTTLS/implicit TLS, builder for RFC822 message construction.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "native-tls",
    "builder",
] }

[dev-dependencies]
# Structural verification of built MIME in tests (multipart tree, part bytes).
mail-parser = { version = "1.0", features = ["full_encoding"] }
